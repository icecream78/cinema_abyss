apiVersion: v1
kind: ConfigMap
metadata:
  name: cinemaabyss-config
  namespace: cinemaabyss
data:
  # Database configuration
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "cinemaabyss"
  DB_USER: "postgres"

  # Service URLs
  MONOLITH_URL: "http://monolith:8080"
  MOVIES_SERVICE_URL: "http://movies-service:8081"
  EVENTS_SERVICE_URL: "http://events-service:8082"

  # Strangler Fig configuration
  GRADUAL_MIGRATION: "true"
  PROXY_RULE_1_MAPPING: "/api/movies -> http://movies-service:8081"
  PROXY_RULE_1_PERCENT: "50"
  PROXY_RULE_2_MAPPING: "/api/events -> http://events-service:8082"
  PROXY_RULE_2_PERCENT: "100"

